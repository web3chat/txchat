env="release"

[log]
    Level="info"
    Mode="console"
    Path=""
    Display="json"

[Trace]
    ServiceName=""
    Gen128Bit=true
[Trace.Sampler]
    Type="const"
    Param=1.0
[Trace.Reporter]
    LogSpans=true
    LocalAgentHostPort="txchat-jaeger:6831"

[reg]
    schema   = "im"
    srvName  = "logic"
    regAddrs = "txchat-etcd:2379"

[node]
    heartbeat = "4m"
    heartbeatMax = 2

[backoff]
    maxDelay  = 300
    baseDelay = 3
    factor    = 1.8
    jitter    = 0.3

[RPCServer]
    Network                           = "tcp"
    Addr                              = ":3119"
    Timeout                           = "1s"
    KeepAliveMaxConnectionIdle        = "60s"
    KeepAliveMaxConnectionAge         = "2h"
    KeepAliveMaxMaxConnectionAgeGrace = "20s"
    KeepAliveTime                     = "60s"
    KeepAliveTimeout                  = "20s"


[CometRPCClient]
    schema  = "im"
    srvName = "comet"
    dial    = "1s"
    timeout = "1s"

[kafka]
    topic   = "goim-push-topic"
    brokers = ["txchat-kafka:9092"]

[redis]
    network      = "tcp"
    addr         = "txchat-redis:6379"
    active       = 60000
    idle         = 1024
    dialTimeout  = "200ms"
    readTimeout  = "500ms"
    writeTimeout = "500ms"
    idleTimeout  = "120s"
    expire       = "30m"

 
[[apps]]
    appId   = "dtalk"
    authUrl = "http://txchat-gateway-node1:19000/user/login"
    timeout = "5s"

[[apps]]
    appId   = "dtalk-eth"
    authUrl = "http://txchat-gateway-node1:19000/eth/login"
    timeout = "5s"


# 登录审计（写入 dtalk_record.dtalk_login_log）
# 密码与 dtalk Compose 的 MYSQL_ROOT_PASSWORD 对齐：容器环境变量 MYSQL_PASSWORD
# dsn 留空则禁用写库；主机名用容器名 txchat-mysql（与 dtalk 其他服务一致）
[loginLog]
    driver = "mysql"
    dsn = "root:${MYSQL_PASSWORD}@tcp(txchat-mysql:3306)/dtalk_record?charset=utf8mb4&parseTime=True&loc=Local"
    maxOpenConns = 100
    maxIdleConns = 10
    connMaxLifetime = "1h"

# 联邦 Presence 上报（url 或 clusterId 为空则禁用，不影响本集群）
# 与 MYSQL_PASSWORD 相同：由 compose 从 im/run_compose/.env 注入（init-compose 会从 dtalk 同步）
[presence]
    url = "${PRESENCE_URL}"
    clusterId = "${CLUSTER_ID}"
    timeout = "2s"
