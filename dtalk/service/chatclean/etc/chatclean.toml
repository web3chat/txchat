AppId = "dtalk"
Env   = "release"

[Log]
  Level   = "info"
  Mode    = "console"
  Path    = ""
  Display = "json"

[GRPCServer]
  Network = "tcp"
  Addr    = ":30010"
  Timeout = "1s"

[Reg]
  Schema   = "dtalk"
  SrvName  = "chatclean"
  RegAddrs = "txchat-etcd:2379"

[MySQL]
  Host     = "txchat-mysql"
  Port     = 3306
  User     = "root"
  Pwd      = "${MYSQL_PASSWORD}"
  Db       = "dtalk"
  RecordDb = "dtalk_record"

[Scheduler]
  Interval  = "1h"
  BatchSize = 500

[Retention]
  Enable     = true
  Keep       = "168h"
  MaxBatches = 200

[Redis]
  Enable = false
  Addr   = ""
  Auth   = ""

[MinIO]
  Enable     = false
  Endpoint   = ""
  Bucket     = ""
  AccessKey  = ""
  SecretKey  = ""
  UseSSL     = false
  MaxObjects = 2000
